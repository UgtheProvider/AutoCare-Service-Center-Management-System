<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Assignment — AutoCare v1.0</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=SFMono-Regular&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
      
      <!-- Top Header -->
      <header class="app-header" id="app-header"></header>

      <!-- Page Content -->
      <main class="page-content">
        
        <!-- Header -->
        <div class="page-header">
          <div class="page-title-group">
            <h1 class="page-title">Technician Resource Assignment</h1>
            <p class="page-subtitle">Allocate incoming unassigned service requests to certified service center technicians.</p>
          </div>
          <div class="page-actions">
            <a href="requests.html" class="btn btn-secondary">View All Requests</a>
          </div>
        </div>

        <!-- Notification Banner -->
        <div id="assignment-alert" class="hidden" style="margin-bottom: var(--space-6); padding: var(--space-4); border-radius: var(--radius-md); font-size: var(--font-size-sm);"></div>

        <!-- Unassigned Requests Container -->
        <div id="assignment-queue-container">
          <div class="loading-container">
            <span class="spinner spinner-dark spinner-lg"></span>
            <p>Loading unassigned requests and technician directory from server...</p>
          </div>
        </div>

      </main>

      <!-- Footer -->
      <footer class="app-footer">
        <div><strong>AutoCare v1.0</strong> — Manager Portal</div>
        <div>Smarter Service. Better Drives.</div>
      </footer>

    </div>
  </div>

  <script type="module" src="../js/manager/assignment.js"></script>
</body>
</html>
