<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Service Requests — AutoCare v1.0</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=SFMono-Regular&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
      
      <!-- Top Header -->
      <header class="app-header" id="app-header"></header>

      <!-- Page Content -->
      <main class="page-content">
        
        <!-- Header -->
        <div class="page-header">
          <div class="page-title-group">
            <h1 class="page-title">Service Requests Management</h1>
            <p class="page-subtitle">Comprehensive registry of all customer service requests across the service center.</p>
          </div>
          <div class="page-actions">
            <a href="assignment.html" class="btn btn-primary">
              <span>👥 Assign Technicians</span>
            </a>
          </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="input-mgr-search" class="form-control search-input" placeholder="Search by plate, customer, technician, ID...">
          </div>

          <div class="filter-group">
            <label for="select-mgr-status" class="text-xs font-semibold text-muted">Status:</label>
            <select id="select-mgr-status" class="form-control" style="min-width: 180px;">
              <option value="ALL" selected>All Requests</option>
              <option value="CREATED">Created</option>
              <option value="RECEIVED">Received</option>
              <option value="INSPECTION">Inspection</option>
              <option value="AWAITING_APPROVAL">Awaiting Approval</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="QUALITY_CHECK">Quality Check</option>
              <option value="READY_FOR_PICKUP">Ready for Pickup</option>
              <option value="CLOSED">Closed</option>
            </select>
          </div>
        </div>

        <!-- Service Requests Table Card -->
        <div class="card">
          <div class="card-body" id="mgr-requests-container" style="padding: 0;">
            <div class="loading-container">
              <span class="spinner spinner-dark spinner-lg"></span>
              <p>Loading service requests from server...</p>
            </div>
          </div>
        </div>

      </main>

      <!-- Request Inspector Modal -->
      <div id="mgr-request-modal" class="modal-backdrop">
        <div class="modal-dialog modal-lg">
          <div class="modal-header">
            <div>
              <h3 class="modal-title" id="mgr-modal-title">Service Request Details</h3>
              <p class="card-subtitle" id="mgr-modal-subtitle"></p>
            </div>
            <button type="button" class="modal-close-btn" id="mgr-modal-close">&times;</button>
          </div>
          <div class="modal-body" id="mgr-modal-body">
            <!-- Dynamic Content -->
          </div>
          <div class="modal-footer" id="mgr-modal-footer">
            <button type="button" class="btn btn-secondary" id="mgr-modal-dismiss">Close</button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="app-footer">
        <div><strong>AutoCare v1.0</strong> — Manager Portal</div>
        <div>Smarter Service. Better Drives.</div>
      </footer>

    </div>
  </div>

  <script type="module" src="../js/manager/requests.js"></script>
</body>
</html>
