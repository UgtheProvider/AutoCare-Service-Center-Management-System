<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AutoCare v1.0</title>
  <meta name="description" content="Sign in to your AutoCare account to manage vehicles, track service requests, or manage service operations.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=SFMono-Regular&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <div class="auth-logo-icon">A</div>
        <div class="auth-logo-text">AutoCare</div>
      </a>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to access your portal</p>
    </div>

    <!-- Alert / Notice Area -->
    <div id="login-alert" class="hidden" style="margin-bottom: var(--space-4); padding: var(--space-3); border-radius: var(--radius-md); font-size: var(--font-size-xs);"></div>

    <!-- Login Form -->
    <form id="login-form" novalidate>
      
      <!-- Login Identifier (Email or Phone) -->
      <div class="form-group" id="group-login">
        <label for="input-login" class="form-label form-label-required">
          Email or Phone Number
        </label>
        <input 
          type="text" 
          id="input-login" 
          class="form-control" 
          placeholder="name@example.com or 9876543210" 
          autocomplete="username"
          required
        >
        <div class="form-error" id="error-login">Please enter your email or phone number.</div>
      </div>

      <!-- Password -->
      <div class="form-group" id="group-password">
        <label for="input-password" class="form-label form-label-required">
          Password
        </label>
        <input 
          type="password" 
          id="input-password" 
          class="form-control" 
          placeholder="Enter your password" 
          autocomplete="current-password"
          required
        >
        <div class="form-error" id="error-password">Please enter your password.</div>
      </div>

      <!-- Submit Button -->
      <div class="form-group" style="margin-top: var(--space-6);">
        <button type="submit" id="btn-login-submit" class="btn btn-primary w-full btn-lg">
          <span id="btn-login-text">Sign In</span>
          <span id="btn-login-spinner" class="spinner hidden"></span>
        </button>
      </div>

    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html" class="font-semibold">Register here</a>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
